<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>BMI & Health — Emotion Voice AI</title>
<link rel="stylesheet" href="style.css"/>
<style>
body{overflow-y:auto}
.bmi-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}
@media(max-width:640px){.bmi-grid{grid-template-columns:1fr}}
.bmi-form-card{padding:28px}
.calcbtn{width:100%;padding:13px;border-radius:12px;background:linear-gradient(135deg,var(--cyan),#2BA898);border:none;color:#04040f;font-family:var(--font-h);font-size:13px;font-weight:700;cursor:pointer;letter-spacing:.08em;transition:all .2s;box-shadow:0 8px 30px rgba(61,207,186,.3)}
.calcbtn:hover{transform:translateY(-2px);box-shadow:0 12px 40px rgba(61,207,186,.4)}
.bmi-result-card{padding:28px;display:flex;flex-direction:column;gap:16px}
.bval{font-family:var(--font-h);font-size:56px;font-weight:900;line-height:1}
.bcat{font-size:16px;font-weight:600;margin-top:4px}
.badv{font-size:13px;color:var(--muted);line-height:1.6}
.bmeter{height:8px;background:var(--bg3);border-radius:4px;overflow:hidden;margin-top:12px}
.bfill{height:100%;border-radius:4px;transition:width .8s cubic-bezier(.22,1,.36,1)}
.bscale{display:flex;justify-content:space-between;font-size:10px;color:var(--dim);margin-top:4px}
#rec-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.rcard{padding:16px;border-radius:14px;background:linear-gradient(145deg,rgba(20,18,50,.8),rgba(12,11,30,.9));border:1px solid var(--border);transition:all .25s}
.rcard:hover{border-color:rgba(61,207,186,.3);transform:translateY(-3px);box-shadow:0 12px 30px rgba(61,207,186,.1)}
.rcard .ri{font-size:24px;margin-bottom:8px}
.rcard .rt{font-size:12px;font-weight:600;margin-bottom:4px}
.rcard .rd{font-size:11px;color:var(--muted);line-height:1.5}
.lrec{color:var(--muted);font-size:12px;text-align:center;padding:30px;grid-column:1/-1;animation:sdotpulse 1.5s ease-in-out infinite}
.placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--muted);text-align:center;gap:12px;padding:30px 0}
</style>
</head>
<body>
<canvas id="bg-canvas"></canvas>
<div class="orb orb1"></div><div class="orb orb2"></div><div class="orb orb3"></div>

<nav class="top-nav">
  <a href="dashboard.html" class="back-btn">← Dashboard</a>
  <div>
    <div class="page-h" style="background:linear-gradient(90deg,var(--cyan),var(--v2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text">BMI & HEALTH</div>
    <div style="font-size:11px;color:var(--muted);margin-top:2px">Calculate BMI + get AI-powered health recommendations</div>
  </div>
  <div class="nav-right" id="nav-user-area"></div>
</nav>

<div class="page-wrap page-wrap-md" style="position:relative;z-index:10">

  <div class="bmi-grid">
    <!-- Form -->
    <div class="card-3d bmi-form-card">
      <div class="sec-title" style="margin-bottom:20px">YOUR DETAILS</div>
      <div class="fg"><label>Weight (kg)</label><input type="number" id="wt" placeholder="e.g. 70" min="1"/></div>
      <div class="fg"><label>Height (cm)</label><input type="number" id="ht" placeholder="e.g. 175" min="50"/></div>
      <div class="fg"><label>Age</label><input type="number" id="ag" placeholder="e.g. 25" min="1"/></div>
      <div class="fg"><label>Gender</label>
        <select id="gn">
          <option value="not specified">Prefer not to say</option>
          <option value="male">Male</option>
          <option value="female">Female</option>
          <option value="other">Other</option>
        </select>
      </div>
      <button class="calcbtn" onclick="calcBMI()">CALCULATE + GET AI RECS</button>
    </div>

    <!-- Result -->
    <div class="card-3d bmi-result-card">
      <div id="bmi-placeholder" class="placeholder">
        <div style="font-size:52px;opacity:.25">⚖️</div>
        <div style="font-size:13px;line-height:1.6">Enter your details and click calculate to see your BMI score</div>
      </div>
      <div id="bmi-result" style="display:none">
        <div style="display:flex;align-items:baseline;gap:14px;flex-wrap:wrap">
          <div class="bval" id="bval">—</div>
          <div><div class="bcat" id="bcat">—</div><div class="badv" id="badv"></div></div>
        </div>
        <div class="bmeter"><div class="bfill" id="bfill"></div></div>
        <div class="bscale"><span>16</span><span>18.5</span><span>25</span><span>30</span><span>40+</span></div>
      </div>
    </div>
  </div>

  <!-- Recommendations -->
  <div class="card-3d" style="padding:24px">
    <div class="sec-title">AI RECOMMENDATIONS</div>
    <div id="rec-list">
      <div style="text-align:center;color:var(--muted);font-size:13px;padding:20px">Calculate your BMI to get personalized AI recommendations</div>
    </div>
  </div>

</div>

<script src="app.js"></script>
<script>
const user = Auth.require();
if(user) renderNav(user);
const email = user?.email;

const CMAP2={green:'#4ADE80',amber:'#F5A623',blue:'#60A5FA',red:'#F87171'};

async function calcBMI(){
  const w=parseFloat(document.getElementById('wt').value);
  const h=parseFloat(document.getElementById('ht').value);
  const a=parseInt(document.getElementById('ag').value)||25;
  const g=document.getElementById('gn').value;
  if(!w||!h){alert('Please enter weight and height.');return;}

  const res=await fetch('/api/bmi',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({weight_kg:w,height_cm:h})});
  const data=await res.json();
  if(data.error){alert(data.error);return;}

  document.getElementById('bmi-placeholder').style.display='none';
  document.getElementById('bmi-result').style.display='block';
  document.getElementById('bval').textContent=data.bmi;
  document.getElementById('bcat').textContent=data.category;
  document.getElementById('badv').textContent=data.advice;
  const col=CMAP2[data.color]||'#A594FF';
  document.getElementById('bval').style.color=col;
  document.getElementById('bcat').style.color=col;
  const pct=Math.min(100,Math.max(0,((data.bmi-15)/25)*100));
  document.getElementById('bfill').style.cssText=`width:${pct}%;background:${col}`;

  // Save
  if(email){
    const bmiData=Auth.getData(email,'bmi');
    bmiData.push({bmi:data.bmi,category:data.category,date:new Date().toLocaleDateString()});
    Auth.setData(email,'bmi',bmiData);
  }

  const rl=document.getElementById('rec-list');
  rl.innerHTML='<div class="lrec">Generating personalized recommendations…</div>';
  try{
    const rr=await fetch('/api/recommendations',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({bmi:data.bmi,category:data.category,age:a,gender:g})});
    const rd=await rr.json();
    rl.innerHTML='';
    rd.recommendations.forEach(r=>{const c=document.createElement('div');c.className='rcard';c.innerHTML=`<div class="ri">${r.icon}</div><div class="rt">${r.title}</div><div class="rd">${r.detail}</div>`;rl.appendChild(c);});
  }catch(e){rl.innerHTML='<div style="color:var(--muted);font-size:12px;grid-column:1/-1;padding:12px">Could not load recommendations.</div>';}
}
</script>
</body>
</html>
