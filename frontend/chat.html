<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Chat — Emotion Voice AI</title>
<link rel="stylesheet" href="style.css"/>
<style>
body{display:flex;flex-direction:column;height:100vh;overflow:hidden}
.chat-body{flex:1;display:flex;flex-direction:column;overflow:hidden;max-width:860px;width:100%;margin:0 auto;padding:0 16px}
.voice-toggle{display:flex;align-items:center;gap:6px;padding:5px 12px;border-radius:20px;border:1px solid var(--border);background:var(--glass);font-size:11px;color:var(--muted);cursor:pointer;transition:all .2s;user-select:none}
.voice-toggle.on{border-color:var(--cyan);color:var(--cyan);background:rgba(61,207,186,.1)}
.voice-toggle .vdot{width:6px;height:6px;border-radius:50%;background:var(--muted);transition:background .2s}
.voice-toggle.on .vdot{background:var(--cyan);box-shadow:0 0 6px var(--cyan)}
.voice-toggle.speaking{border-color:var(--rose);color:var(--rose);background:rgba(240,98,146,.1);animation:speakRing .8s ease-in-out infinite alternate}
@keyframes speakRing{from{box-shadow:0 0 0 0 rgba(240,98,146,.3)}to{box-shadow:0 0 0 4px rgba(240,98,146,0)}}
#emotion-strip{display:flex;gap:7px;padding:9px 0;overflow-x:auto;scrollbar-width:none;flex-shrink:0}
#emotion-strip::-webkit-scrollbar{display:none}
.e-pill{display:flex;align-items:center;gap:5px;padding:4px 12px;border-radius:20px;border:1px solid var(--border);background:var(--glass);font-size:11px;color:var(--muted);cursor:pointer;transition:all .2s;user-select:none;white-space:nowrap}
.e-pill:hover{border-color:var(--border-hi);color:var(--text)}
.e-pill.active{border-color:var(--v);color:var(--v2);background:rgba(139,124,246,.12)}
.e-pill .dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
#messages{flex:1;overflow-y:auto;padding:10px 0;display:flex;flex-direction:column;gap:12px;scrollbar-width:thin;scrollbar-color:var(--dim) transparent;min-height:0}
#messages::-webkit-scrollbar{width:3px}
#messages::-webkit-scrollbar-thumb{background:var(--dim);border-radius:2px}
.day-div{display:flex;align-items:center;gap:10px;flex-shrink:0}
.day-div::before,.day-div::after{content:'';flex:1;height:1px;background:var(--border)}
.day-div span{font-size:10px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.msg-row{display:flex;gap:8px;align-items:flex-end;animation:msgIn .32s cubic-bezier(.22,1,.36,1)}
.msg-row.user{flex-direction:row-reverse}
@keyframes msgIn{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}
.av{width:30px;height:30px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px}
.av.ai{background:linear-gradient(135deg,var(--v),var(--rose))}
.av.usr{background:var(--glass-b);border:1px solid var(--border)}
.mblock{display:flex;flex-direction:column;max-width:76%}
.msg-row.user .mblock{align-items:flex-end}
.bubble{padding:10px 15px;border-radius:16px;font-size:14px;line-height:1.65;word-break:break-word}
.user .bubble{background:linear-gradient(135deg,var(--v),#6358E8);color:#fff;border-bottom-right-radius:4px;box-shadow:0 4px 18px rgba(139,124,246,.3)}
.ai .bubble{background:linear-gradient(145deg,rgba(20,18,50,.9),rgba(14,13,38,.95));border:1px solid var(--border);border-bottom-left-radius:4px}
.ai.speaking-now .bubble{border-color:rgba(61,207,186,.4);box-shadow:0 0 14px rgba(61,207,186,.15)}
.mmeta{display:flex;align-items:center;gap:7px;margin-top:5px;padding:0 2px;flex-wrap:wrap}
.mmeta time{font-size:10px;color:var(--muted)}
.ebadge{font-size:10px;padding:2px 8px;border-radius:10px;border:1px solid;letter-spacing:.04em}
.cbar{height:3px;border-radius:2px;max-width:50px}
.speak-btn{display:flex;align-items:center;gap:4px;font-size:10px;padding:2px 9px;border-radius:10px;border:1px solid rgba(61,207,186,.35);color:var(--cyan);background:rgba(61,207,186,.07);cursor:pointer;transition:all .2s;user-select:none}
.speak-btn:hover{background:rgba(61,207,186,.15)}
.speak-btn.active{border-color:var(--rose);color:var(--rose);background:rgba(240,98,146,.08)}
.wbar{display:flex;gap:2px;align-items:center;height:12px;margin-top:6px;opacity:.35}
.wbar span{width:2px;border-radius:2px;background:var(--v);animation:wv 1.2s ease-in-out infinite}
@keyframes wv{0%,100%{height:3px}50%{height:11px}}
.ai.speaking-now .wbar{opacity:.8}
.ai.speaking-now .wbar span{background:var(--cyan)}
.typing-row{display:flex;gap:8px;align-items:flex-end;animation:msgIn .3s ease}
.tbubble{background:linear-gradient(145deg,rgba(20,18,50,.9),rgba(14,13,38,.95));border:1px solid var(--border);border-radius:16px;border-bottom-left-radius:4px;padding:13px 16px;display:flex;gap:5px;align-items:center}
.tbubble span{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:tdot 1.2s ease-in-out infinite}
.tbubble span:nth-child(2){animation-delay:.18s}
.tbubble span:nth-child(3){animation-delay:.36s}
@keyframes tdot{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-6px);opacity:1}}
.err-bubble{background:rgba(240,98,146,.1);border:1px solid rgba(240,98,146,.3);color:var(--rose);padding:10px 14px;border-radius:16px;font-size:13px;max-width:76%}
#input-wrap{flex-shrink:0;padding:9px 0 14px;display:flex;flex-direction:column;gap:6px}
#voice-settings{display:flex;gap:10px;align-items:center;padding:6px 12px;background:rgba(14,13,38,.8);border:1px solid var(--border);border-radius:12px;flex-wrap:wrap}
#voice-settings label{font-size:10px;color:var(--muted);letter-spacing:.05em}
#voice-settings select,#voice-settings input[type=range]{background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:var(--font-b);font-size:11px;padding:3px 8px;outline:none}
#voice-settings input[type=range]{padding:0;width:70px;accent-color:var(--v)}
.vs-group{display:flex;align-items:center;gap:5px}
.vs-val{font-size:10px;color:var(--cyan);min-width:24px}
.irow{display:flex;gap:8px;align-items:center;background:linear-gradient(145deg,rgba(20,18,50,.9),rgba(12,11,35,.95));border:1px solid var(--border);border-radius:28px;padding:7px 7px 7px 16px;transition:border-color .2s;box-shadow:0 4px 20px rgba(0,0,0,.3)}
.irow:focus-within{border-color:var(--v);box-shadow:0 4px 20px rgba(0,0,0,.3),0 0 0 3px rgba(139,124,246,.1)}
#msg-input{flex:1;background:transparent;border:none;outline:none;color:var(--text);font-family:var(--font-b);font-size:14px;line-height:1.5;resize:none;max-height:90px;min-height:22px}
#msg-input::placeholder{color:var(--muted)}
#msg-input:disabled{opacity:.4}
.ibtn{width:34px;height:34px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;border:none;background:none}
.ibtn.mic{background:var(--glass-b);border:1px solid var(--border);color:var(--muted)}
.ibtn.mic:hover{border-color:var(--rose);color:var(--rose)}
.ibtn.mic.recording{background:rgba(240,98,146,.2);border-color:var(--rose);color:var(--rose);animation:mpulse 1s ease infinite}
@keyframes mpulse{0%,100%{box-shadow:0 0 0 0 rgba(240,98,146,.4)}50%{box-shadow:0 0 0 7px rgba(240,98,146,0)}}
.ibtn.send{background:linear-gradient(135deg,var(--v),var(--rose));box-shadow:0 4px 14px rgba(139,124,246,.5)}
.ibtn.send:hover{transform:scale(1.08)}
.ibtn.send:active{transform:scale(.94)}
.ibtn.send:disabled{opacity:.35;cursor:not-allowed;transform:none;box-shadow:none}
.ibtn.send svg{fill:#fff}
.ifooter{display:flex;justify-content:space-between;font-size:10px;color:var(--dim);padding:0 4px}
.murf-badge{font-size:10px;padding:2px 8px;border-radius:10px;border:1px solid rgba(61,207,186,.35);color:var(--cyan);background:rgba(61,207,186,.07)}
</style>
</head>
<body>
<canvas id="bg-canvas"></canvas>
<div class="orb orb1"></div><div class="orb orb2"></div><div class="orb orb3"></div>

<nav class="top-nav">
  <a href="dashboard.html" class="back-btn">← Dashboard</a>
  <span style="font-family:var(--font-h);font-size:13px;font-weight:700;letter-spacing:.08em;background:linear-gradient(90deg,var(--v2),var(--rose));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text">EMOTION CHAT</span>
  <div class="nav-right">
    <div class="voice-toggle" id="voice-toggle" onclick="toggleVoice()">
      <div class="vdot"></div><span id="vtxt">Voice Off</span>
    </div>
    <div class="status-pill"><div class="sdot" id="sdot"></div><span id="stext">Connecting...</span></div>
    <button class="hbtn2" onclick="clearChat()">Clear</button>
  </div>
</nav>

<div class="chat-body">
  <div id="emotion-strip">
    <div class="e-pill active"><div class="dot" style="background:#A899FF"></div>All</div>
    <div class="e-pill"><div class="dot" style="background:#F9D849"></div>Happy</div>
    <div class="e-pill"><div class="dot" style="background:#4DD9C0"></div>Calm</div>
    <div class="e-pill"><div class="dot" style="background:#6C7EE1"></div>Sad</div>
    <div class="e-pill"><div class="dot" style="background:#F06292"></div>Anxious</div>
    <div class="e-pill"><div class="dot" style="background:#FF6B6B"></div>Angry</div>
    <div class="e-pill"><div class="dot" style="background:#A78BFA"></div>Curious</div>
  </div>
  <div id="messages"></div>
  <div id="input-wrap">
    <div id="voice-settings" style="display:none">
      <div class="vs-group"><label>VOICE</label><select id="voice-select" onchange="TTS.selectedIdx=parseInt(this.value)"></select></div>
      <div class="vs-group"><label>RATE</label><input type="range" id="rate-slider" min="0.6" max="1.6" step="0.1" value="0.95" oninput="document.getElementById('rate-val').textContent=this.value"/><span class="vs-val" id="rate-val">0.95</span></div>
      <div class="vs-group"><label>PITCH</label><input type="range" id="pitch-slider" min="0.5" max="1.8" step="0.1" value="1.05" oninput="document.getElementById('pitch-val').textContent=this.value"/><span class="vs-val" id="pitch-val">1.05</span></div>
      <div class="vs-group" style="margin-left:auto"><button onclick="TTS.speak('Hello testing voice','neutral')" style="background:rgba(139,124,246,.15);border:1px solid rgba(139,124,246,.3);border-radius:8px;color:var(--v2);font-size:11px;padding:4px 10px;cursor:pointer;font-family:var(--font-b)">Test</button></div>
    </div>
    <div class="irow">
      <textarea id="msg-input" rows="1" placeholder="Express yourself... I'll sense your emotion"></textarea>
      <button class="ibtn mic" id="mic-btn"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 1a4 4 0 0 1 4 4v7a4 4 0 0 1-8 0V5a4 4 0 0 1 4-4zm0 2a2 2 0 0 0-2 2v7a2 2 0 0 0 4 0V5a2 2 0 0 0-2-2zm7 8a1 1 0 0 1 .993.883L20 12a8 8 0 0 1-7 7.938V22h3a1 1 0 1 1 0 2H8a1 1 0 1 1 0-2h3v-2.062A8 8 0 0 1 4 12a1 1 0 1 1 2 0 6 6 0 0 0 12 0 1 1 0 0 1 1-1z"/></svg></button>
      <button class="ibtn send" id="send-btn"><svg width="14" height="14" viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg></button>
    </div>
    <div class="ifooter"><span>Enter to send · Shift+Enter new line</span><span id="hcount" style="color:var(--muted)"></span></div>
  </div>
</div>

<script src="app.js"></script>
<script>
const user=Auth.require();if(!user)throw '';
const email=user.email;
let chatData=Auth.getData(email,'chat');
let msgCount=0,isLoading=false,murfReady=false;
const msgsEl=document.getElementById('messages');

function setLoading(v){isLoading=v;document.getElementById('send-btn').disabled=v;document.getElementById('msg-input').disabled=v;}

function toggleVoice(){
  TTS.enabled=!TTS.enabled;
  const tog=document.getElementById('voice-toggle');
  tog.classList.toggle('on',TTS.enabled);
  document.getElementById('vtxt').textContent=TTS.enabled?'Voice On':'Voice Off';
  document.getElementById('voice-settings').style.display=TTS.enabled&&!murfReady?'flex':'none';
  if(TTS.enabled&&!TTS.voices.length)TTS.loadVoices().then(()=>TTS.populateSelect());
  if(!TTS.enabled)TTS.stop();
}

async function checkStatus(){
  try{
    const r=await fetch('/api/status');const d=await r.json();
    document.getElementById('sdot').className='sdot'+(d.openai?'':' warn');
    document.getElementById('stext').textContent=d.openai?d.model:'Fallback';
    murfReady=d.murf||false;
    if(murfReady){
      document.getElementById('vtxt').textContent='Murf Falcon';
      document.getElementById('voice-toggle').style.borderColor='rgba(61,207,186,.5)';
    }
  }catch(e){
    document.getElementById('sdot').className='sdot off';
    document.getElementById('stext').textContent='Offline';
  }
}

function addDivider(){const d=document.createElement('div');d.className='day-div';d.innerHTML='<span>'+today()+'</span>';msgsEl.appendChild(d);}

function addMsg(text,role,emotion,confidence,autoSpeak,audioB64,voiceStyle){
  const row=document.createElement('div');row.className='msg-row '+role;
  const av=document.createElement('div');av.className='av '+(role==='ai'?'ai':'usr');av.textContent=role==='ai'?'🤖':'👤';
  const block=document.createElement('div');block.className='mblock';
  const bubble=document.createElement('div');bubble.className='bubble';bubble.textContent=text;
  if(role==='ai'){const w=document.createElement('div');w.className='wbar';w.innerHTML=waveHTML(8);bubble.appendChild(w);}
  const meta=document.createElement('div');meta.className='mmeta';
  const t=document.createElement('time');t.textContent=fmt(new Date());meta.appendChild(t);
  if(emotion){
    const c=EC[emotion]||'#A594FF';
    const badge=document.createElement('span');badge.className='ebadge';badge.style.cssText='color:'+c+';border-color:'+c+'40;background:'+c+'15';badge.textContent=emotion;meta.appendChild(badge);
    if(confidence){const bar=document.createElement('div');bar.className='cbar';bar.style.cssText='width:'+Math.round(confidence*100)+'%;background:'+c+'60;height:3px;border-radius:2px';meta.appendChild(bar);}
  }
  if(voiceStyle){const mb=document.createElement('span');mb.className='murf-badge';mb.textContent='Murf: '+voiceStyle;meta.appendChild(mb);}
  if(role==='ai'){
    const spk=document.createElement('button');spk.className='speak-btn';
    spk.innerHTML='<svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg> Speak';
    let currentAudio=null;
    spk.onclick=()=>{
      if(audioB64){
        if(currentAudio){currentAudio.pause();currentAudio=null;spk.innerHTML='<svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg> Speak';spk.classList.remove('active');row.classList.remove('speaking-now');document.getElementById('voice-toggle').classList.remove('speaking');}
        else{currentAudio=new Audio('data:audio/mp3;base64,'+audioB64);spk.innerHTML='<svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg> Stop';spk.classList.add('active');row.classList.add('speaking-now');document.getElementById('voice-toggle').classList.add('speaking');currentAudio.onended=()=>{spk.innerHTML='<svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg> Speak';spk.classList.remove('active');row.classList.remove('speaking-now');document.getElementById('voice-toggle').classList.remove('speaking');currentAudio=null;};currentAudio.play();}
      } else {
        if(TTS.speaking){TTS.stop();spk.innerHTML='<svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg> Speak';spk.classList.remove('active');row.classList.remove('speaking-now');document.getElementById('voice-toggle').classList.remove('speaking');}
        else{spk.innerHTML='<svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg> Stop';spk.classList.add('active');row.classList.add('speaking-now');document.getElementById('voice-toggle').classList.add('speaking');TTS.speak(text,emotion||'neutral',null,()=>{spk.innerHTML='<svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg> Speak';spk.classList.remove('active');row.classList.remove('speaking-now');document.getElementById('voice-toggle').classList.remove('speaking');});}
      }
    };
    meta.appendChild(spk);
  }
  block.appendChild(bubble);block.appendChild(meta);row.appendChild(av);row.appendChild(block);msgsEl.appendChild(row);msgsEl.scrollTop=msgsEl.scrollHeight;
  if(autoSpeak&&TTS.enabled&&role==='ai'&&!audioB64){setTimeout(()=>meta.querySelector('.speak-btn')?.click(),200);}
  if(audioB64&&TTS.enabled&&role==='ai'){setTimeout(()=>meta.querySelector('.speak-btn')?.click(),200);}
}

function addError(text){const row=document.createElement('div');row.className='msg-row ai';const av=document.createElement('div');av.className='av ai';av.textContent='!';const e=document.createElement('div');e.className='err-bubble';e.textContent=text;row.appendChild(av);row.appendChild(e);msgsEl.appendChild(row);msgsEl.scrollTop=msgsEl.scrollHeight;}
function showTyping(){const r=document.createElement('div');r.className='typing-row';r.id='typing';const av=document.createElement('div');av.className='av ai';av.textContent='🤖';const tb=document.createElement('div');tb.className='tbubble';tb.innerHTML='<span></span><span></span><span></span>';r.appendChild(av);r.appendChild(tb);msgsEl.appendChild(r);msgsEl.scrollTop=msgsEl.scrollHeight;}
function removeTyping(){document.getElementById('typing')?.remove();}

async function sendMsg(){
  const inp=document.getElementById('msg-input');
  const text=inp.value.trim();
  if(!text||isLoading)return;
  if(msgCount===0)addDivider();
  const timeStr=fmt(new Date());
  addMsg(text,'user',null,null,false,null,null);
  inp.value='';inp.style.height='auto';msgCount++;setLoading(true);showTyping();
  try{
    const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,tts:TTS.enabled})});
    const data=await res.json();removeTyping();
    if(!res.ok){addError(data.error||'Something went wrong.');}
    else{
      addMsg(data.reply,'ai',data.emotion,data.confidence,true,data.audio_base64||null,data.voice_style||null);
      document.getElementById('hcount').textContent=data.history_len+' exchange'+(data.history_len!==1?'s':'')+' in memory';
      chatData.push({role:'user',content:text,emotion:data.emotion,time:timeStr});
      chatData.push({role:'ai',content:data.reply,emotion:data.emotion,confidence:data.confidence,time:timeStr});
      Auth.setData(email,'chat',chatData);
      murfReady=data.murf_ready||false;
    }
  }catch(e){removeTyping();addError('Cannot reach server. Is Flask running on port 5000?');}
  finally{setLoading(false);}
}
window.sendMsg=sendMsg;

function clearChat(){
  TTS.stop();fetch('/api/chat/clear',{method:'POST'}).catch(()=>{});
  msgsEl.innerHTML='';msgCount=0;document.getElementById('hcount').textContent='';
  setTimeout(()=>{addDivider();addMsg("Chat cleared! What's on your mind?",'ai','calm',.9,true,null,null);msgCount++;},200);
}

document.getElementById('msg-input').addEventListener('input',function(){this.style.height='auto';this.style.height=Math.min(this.scrollHeight,90)+'px';});
document.getElementById('msg-input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg();}});
document.getElementById('send-btn').addEventListener('click',sendMsg);
document.getElementById('mic-btn').addEventListener('click',()=>SR.toggle());
document.querySelectorAll('.e-pill').forEach(p=>{p.addEventListener('click',()=>{document.querySelectorAll('.e-pill').forEach(x=>x.classList.remove('active'));p.classList.add('active');});});

SR.init();
TTS.loadVoices().then(()=>TTS.populateSelect());
checkStatus();
setTimeout(()=>{addDivider();addMsg('Welcome back, '+user.name.split(' ')[0]+'! I detect your emotion and respond with care. Enable Voice above to hear Murf Falcon speak.','ai','warm',.95,false,null,null);msgCount++;},400);
</script>
</body>
</html>
